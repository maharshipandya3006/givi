<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 3840" width="3840" height="3840">
  <defs>
    <!-- Background Ambient Depth -->
    <radialGradient id="backdrop-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#166534" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0f391e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#060907" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Squircle Gradients -->
    <linearGradient id="givi-primary" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#1ea84f" />
      <stop offset="35%" stop-color="#166534" />
      <stop offset="75%" stop-color="#124a27" />
      <stop offset="100%" stop-color="#0b3019" />
    </linearGradient>

    <!-- Specular Highlight Sheen -->
    <linearGradient id="sheen" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-4k" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="70" stdDeviation="60" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#0a2a16" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="3840" height="3840" fill="#080c09" />
  <circle cx="1920" cy="1920" r="1700" fill="url(#backdrop-glow)" />

  <!-- App Icon Badge (2400x2400 centered) -->
  <g transform="translate(720, 720)">
    <!-- Base Squircle with Shadow -->
    <rect 
      x="0" 
      y="0" 
      width="2400" 
      height="2400" 
      rx="720" 
      fill="url(#givi-primary)" 
      filter="url(#shadow-4k)" 
    />
    
    <!-- Top Sheen / Edge Bevel -->
    <rect 
      x="0" 
      y="0" 
      width="2400" 
      height="1200" 
      rx="720" 
      fill="url(#sheen)" 
    />

    <!-- Stroke Bevel -->
    <rect 
      x="4" 
      y="4" 
      width="2392" 
      height="2392" 
      rx="716" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="6" 
      stroke-opacity="0.18" 
    />

    <!-- Center 'g.' Typography -->
    <text
      x="1200"
      y="1580"
      text-anchor="middle"
      fill="#ffffff"
      font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif"
      font-size="1420"
      font-weight="900"
      letter-spacing="-0.05em"
      style="filter: drop-shadow(0 14px 28px rgba(0,0,0,0.35));"
    >g.</text>
  </g>
</svg>

